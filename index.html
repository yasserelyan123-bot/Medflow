<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicFlow - نظام إدارة العيادات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app">
        <div style="max-width:500px;margin:60px auto;padding:20px;text-align:center;font-family:sans-serif;color:#666;">
            جاري التحميل...
        </div>
    </div>

    <script>
        window.SUPABASE_URL = 'https://kuyffwsplojklxebvlbp.supabase.co';
        window.SUPABASE_ANON_KEY = 'sb_publishable__Wpn1N1uqPDqxy606FPkZw_3Xq679Ln';

        // ساعة إنذار: لو الصفحة فضلت "جاري التحميل..." أكتر من 12 ثانية،
        // يبقى فيه مشكلة في تحميل مكتبة Supabase من الإنترنت (شبكة بطيئة/محجوبة)
        // أو في تحميل app.js نفسه، ونوريك رسالة واضحة بدل الصفحة البيضاء.
        window.addEventListener('load', function () {
            setTimeout(function () {
                if (!window.__clinicflow_started__) {
                    document.getElementById('app').innerHTML = `
                        <div style="max-width:600px;margin:40px auto;padding:20px;background:#fee;border:2px solid #f88;border-radius:8px;font-family:sans-serif;direction:rtl;text-align:right;">
                            <h2 style="color:#c00;margin-top:0;">لم يبدأ التطبيق في التحميل</h2>
                            <p style="color:#600;">
                                على الأرجح مكتبة Supabase أو ملف app.js لم يُحمَّلا من الإنترنت
                                (شبكة بطيئة، أو محجوبة، أو ملف app.js غير موجود بجانب index.html).
                                جرّب شبكة إنترنت مختلفة (واي فاي بدل بيانات الموبايل أو العكس)، أو تأكد
                                من رفع ملف app.js في نفس مكان index.html على GitHub.
                            </p>
                        </div>`;
                }
            }, 12000);
        });
    </script>

    <!-- نحاول أولًا من jsdelivr، ولو فشل نجرّب unpkg تلقائيًا كمصدر بديل -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
            onerror="
                var s = document.createElement('script');
                s.src = 'https://unpkg.com/@supabase/supabase-js@2';
                s.async = false;
                s.onerror = function () {
                    document.getElementById('app').innerHTML = '<div style=\'max-width:600px;margin:40px auto;padding:20px;background:#fee;border:2px solid #f88;border-radius:8px;font-family:sans-serif;direction:rtl;text-align:right;\'><h2 style=\'color:#c00;\'>تعذّر تحميل مكتبة Supabase من مصدرين مختلفين</h2><p style=\'color:#600;\'>المشكلة على الأرجح في الشبكة نفسها. جرّب شبكة إنترنت مختلفة تمامًا (واي فاي بدل بيانات الموبايل أو العكس).</p></div>';
                };
                document.head.appendChild(s);
            ">
    </script>

    <script src="app.js"
            onerror="document.getElementById('app').innerHTML='<div style=&quot;max-width:600px;margin:40px auto;padding:20px;background:#fee;border:2px solid #f88;border-radius:8px;font-family:sans-serif;direction:rtl;text-align:right;&quot;><h2 style=&quot;color:#c00;&quot;>تعذّر تحميل app.js</h2><p style=&quot;color:#600;&quot;>تأكد أن ملف app.js موجود في نفس مجلد index.html على GitHub.</p></div>'">
    </script>
</body>
</html>
